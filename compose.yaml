name: otto

services:
  broker:
    image: redis:8-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init.py first}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U paperless -d paperless']
      interval: 10s
      timeout: 5s
      retries: 10

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD:?Run python3 scripts/init.py first}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?Run python3 scripts/init.py first}
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_CONSUMER_POLLING: '10'
      PAPERLESS_URL: http://localhost:8000
      USERMAP_UID: ${USERMAP_UID:-1000}
      USERMAP_GID: ${USERMAP_GID:-1000}
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./consume:/usr/src/paperless/consume
      - ./export:/usr/src/paperless/export
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8000/]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 10

  # OTTO's own database (search index, later facts and cases). Separate from
  # Paperless so either can be upgraded, backed up or rebuilt independently.
  otto-db:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: otto
      POSTGRES_USER: otto
      POSTGRES_PASSWORD: ${OTTO_DB_PASSWORD:?Run python3 scripts/init.py first}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - ottodata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U otto -d otto']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  data:
  media:
  pgdata:
  redisdata:
  ottodata:
