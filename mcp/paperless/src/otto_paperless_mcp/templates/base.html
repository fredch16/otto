<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OTTO{% endblock %}</title>
<style>
:root {
  --bg: #fafaf8; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e6e5e0;
  --accent: #2f5d8a; --accent-soft: #e8eff6; --warn: #8a5a00; --warn-soft: #fbf3e2; --done: #9a9a94;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --surface: #1f1f1d; --text: #e9e8e3; --muted: #9c9b95; --line: #33332f;
    --accent: #8fb6e0; --accent-soft: #23303d; --warn: #e5b45c; --warn-soft: #33291a; --done: #6d6d68;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header.top { border-bottom: 1px solid var(--line); background: var(--surface); }
header.top div { max-width: 980px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 24px; align-items: baseline; }
header.top .brand { font-weight: 700; letter-spacing: .04em; color: var(--text); }
header.top nav a { color: var(--muted); margin-right: 16px; }
header.top nav a.on { color: var(--text); font-weight: 600; }
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 22px; margin: 0 0 4px; line-height: 1.3; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 32px 0 10px; }
.meta { color: var(--muted); font-size: 14px; }
.meta span + span::before { content: "·"; margin: 0 6px; }
.flash { background: var(--accent-soft); border-radius: 6px; padding: 10px 14px; margin-bottom: 20px; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 10px 14px; margin-bottom: 20px; }
.empty { color: var(--muted); }
input[type=search] { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line);
  border-radius: 8px; background: var(--surface); color: var(--text); }
button { font: inherit; font-size: 13px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--text); cursor: pointer; }
button:hover { border-color: var(--accent); color: var(--accent); }
.tag { display: inline-block; font-size: 12px; padding: 0 7px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { text-align: left; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
tr.undone td { color: var(--done); }
tr.undone td .new { text-decoration: line-through; }
.old { color: var(--muted); }
.nowrap { white-space: nowrap; }
@media (max-width: 640px) { .hide-narrow { display: none; } }
</style>
</head>
<body>
<header class="top"><div>
  <a class="brand" href="/">OTTO</a>
  <nav>
    <a href="/" class="{{ 'on' if request.url.path == '/' or request.url.path.startswith('/documents') }}">Documents</a>
    <a href="/activity" class="{{ 'on' if request.url.path == '/activity' }}">Activity</a>
  </nav>
</div></header>
<main>
{% if message %}<div class="flash">{{ message }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
