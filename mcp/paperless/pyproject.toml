[project]
name = "otto-paperless-mcp"
version = "0.1.0"
description = "Read-only Paperless-ngx MCP server for OTTO"
authors = [
    { name = "Fred Charbonnier", email = "frederickcharbonnier@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pdfminer-six>=20260107",
]

[project.scripts]
otto-paperless-mcp = "otto_paperless_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
